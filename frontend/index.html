<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D TopoMapping 🏔️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-mesh"></div>
    
    <main class="container">
        <header class="header">
            <h1>3D TopoMapping 🏔️</h1>
            <p>Generate Professional Topographic Map PDFs</p>
        </header>

        <div class="glass-card">
            <form id="topo-form" novalidate>
                <div class="input-grid">
                    <div class="input-group">
                        <label for="north">North Latitude</label>
                        <input type="number" id="north" name="north" step="any" placeholder="e.g. 37.83" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="south">South Latitude</label>
                        <input type="number" id="south" name="south" step="any" placeholder="e.g. 37.71" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="east">East Longitude</label>
                        <input type="number" id="east" name="east" step="any" placeholder="e.g. -122.35" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="west">West Longitude</label>
                        <input type="number" id="west" name="west" step="any" placeholder="e.g. -122.52" required>
                    </div>
                </div>
                
                <button type="submit" class="generate-btn">
                    <span>Generate Topographic PDF</span>
                </button>
            </form>
        </div>

        <footer class="footer">
            <p>Powered by Google Earth Engine &amp; OpenStreetMap</p>
        </footer>
    </main>

    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>Generating your topographic maps...</p>
    </div>

    <div id="error-toast" class="error-toast hidden">
        <div class="toast-content">
            <span class="toast-icon">⚠️</span>
            <span id="toast-message">An error occurred.</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
